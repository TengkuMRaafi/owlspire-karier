<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0e1626"><title>Berkas terlalu besar | Owlspire</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
/*
 * Halaman error (403, 404, 413, 419, 429, 4xx, 5xx, 503). Prefix er- untuk tata letak, e404- dst. untuk adegan.
 * Berdiri sendiri (tidak mengimpor app.css) supaya tetap tampil saat bundel utama bermasalah.
 * Warna = token design.md (graphite, accent, kuning maskot). Hanya transform dan opacity yang dianimasikan.
 */
:root { --er-bg: #0e1626; --er-soft: #e2e6ec; --er-a400: #7fa8e8; --er-a500: #4f82e6; --er-a600: #3b6cd4; --er-a700: #2f58b3; --er-gold: #f0b429;
    --er-font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; --er-display: 'Poppins', ui-sans-serif, system-ui, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body.er { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--er-bg); color: #fff; font-family: var(--er-font); line-height: 1.5; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
.er h1, .er p { margin: 0; }
.er a { color: inherit; }
.er :focus-visible { outline: 2px solid var(--er-a500); outline-offset: 3px; }

.er-top { position: relative; z-index: 2; display: flex; align-items: center; padding: max(.9rem, env(safe-area-inset-top)) max(1.2rem, env(safe-area-inset-right)) .9rem max(1.2rem, env(safe-area-inset-left)); background: #1b2638; border-bottom: 1px solid rgb(255 255 255 / .1); }
.er-brand { display: inline-flex; align-items: center; gap: .55rem; text-decoration: none; }
.er-mark { display: block; width: 1.5rem; height: auto; }
.er-word { font-family: var(--er-display); font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.er-word b { color: var(--er-a400); font-weight: 700; }

.er-wrap { position: relative; flex: 1; display: grid; align-items: center; overflow: hidden; }
.er-bg { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(40rem 30rem at 12% -8%, rgb(59 108 212 / .38), transparent 70%), radial-gradient(34rem 26rem at 96% 108%, rgb(240 180 41 / .1), transparent 70%); }
.er-bg::before { content: ''; position: absolute; inset: 0; opacity: .45; background-image: linear-gradient(rgb(255 255 255 / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .05) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(70% 70% at 50% 40%, #000, transparent 85%); mask-image: radial-gradient(70% 70% at 50% 40%, #000, transparent 85%); }
.er-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 44rem; margin: 0 auto; padding: 1.6rem 1.1rem calc(2.8rem + env(safe-area-inset-bottom)); text-align: center; }

.er-scene { position: relative; width: min(25rem, 100%); }
.er-big { position: absolute; z-index: 0; top: -.15rem; left: 50%; font-family: var(--er-display); font-size: clamp(6.5rem, 30vw, 11.5rem); font-weight: 800; line-height: .8; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 2px rgb(127 168 232 / .3); transform: translateX(-50%); white-space: nowrap; user-select: none; animation: er-drift 8s ease-in-out infinite; }
.er-svg { position: relative; z-index: 1; display: block; width: 100%; height: auto; overflow: visible; }

.er-code { margin-top: .6rem; padding: .28rem .85rem; border: 1px solid rgb(127 168 232 / .38); border-radius: 99px; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--er-a400); }
.er-title { margin-top: .85rem; font-family: var(--er-display); font-size: clamp(1.9rem, 6.4vw, 2.7rem); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.er-lead { max-width: 32rem; margin-top: 1rem; font-size: 1rem; line-height: 1.7; color: var(--er-soft); }
.er-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 1.7rem; }
.er-btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 2.9rem; padding: .7rem 1.6rem; border: 1px solid transparent; border-radius: .6rem; font: 700 1rem/1.2 var(--er-font); text-decoration: none; cursor: pointer; transition: background-color .2s, border-color .2s, opacity .2s; }
.er-btn-primary { background: var(--er-a600); color: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .3); }
.er-btn-primary:hover { background: var(--er-a700); }
.er-btn-ghost { border-color: rgb(255 255 255 / .3); color: #fff; }
.er-btn-ghost:hover { border-color: #fff; background: rgb(255 255 255 / .1); }
.er-btn.is-wait { opacity: .45; pointer-events: none; }
.er-note { margin-top: 1.3rem; font-size: .9rem; color: #c5cfde; }
.er-note a { color: var(--er-a400); font-weight: 700; }

.er-timer { position: relative; display: grid; place-items: center; width: 5.8rem; height: 5.8rem; margin-top: 1.5rem; }
.er-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.er-ring circle { fill: none; stroke-width: 5; }
.er-ring-bg { stroke: rgb(255 255 255 / .12); }
.er-ring-fg { stroke: var(--er-gold); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
.er-timer b { position: relative; font-family: var(--er-display); font-size: 1.55rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.er-timer small { position: absolute; bottom: 1.15rem; font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #c5cfde; }
.er-poll { display: flex; align-items: center; justify-content: center; gap: .9rem; margin-top: 1.4rem; font-size: .78rem; font-weight: 700; color: #c5cfde; }
.er-bar { position: relative; width: 9rem; height: .4rem; overflow: hidden; border-radius: 99px; background: rgb(255 255 255 / .12); }
.er-bar i { position: absolute; inset: 0; width: 45%; border-radius: 99px; background: linear-gradient(90deg, var(--er-a600), var(--er-gold)); animation: er-load 2.4s ease-in-out infinite; }
.er-poll { flex-wrap: wrap; row-gap: .6rem; }
.er-poll > span:last-child { white-space: nowrap; }
.er-poll b { font-variant-numeric: tabular-nums; color: #fff; }

.er-in { animation: er-in .7s var(--d, 0s) cubic-bezier(.2, .8, .2, 1) both; }
@keyframes er-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes er-drift { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -7px); } }
@keyframes er-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(230%); } }
@keyframes er-float { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-8px) rotate(8deg); } }
@keyframes er-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
.er-blink { transform-origin: 60px 76px; animation: er-blink 5.5s infinite; }
.e404-q { transform-box: fill-box; transform-origin: 50% 50%; animation: er-float 3.4s ease-in-out infinite; }
.e404-q2 { animation-delay: -1.6s; }

/* 404: bingung di pertigaan */
.e404-owl { transform-origin: 60px 136px; animation: e404-tilt 4.6s ease-in-out infinite; }
.e404-look { animation: e404-look 4.6s ease-in-out infinite; }
.e404-map { transform-origin: 60px 118px; animation: e404-map 3.2s ease-in-out infinite; }
.e404-bd { animation: e404-swing 3.6s ease-in-out infinite alternate; }
.e404-b1 { transform-origin: 290px 111px; } .e404-b2 { transform-origin: 290px 137px; animation-delay: -1.1s; } .e404-b3 { transform-origin: 290px 163px; animation-delay: -2.2s; }
.e404-fp { opacity: 0; animation: e404-fp 5s ease-in-out infinite; animation-delay: calc(var(--i) * .55s); }
@keyframes e404-tilt { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
@keyframes e404-look { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
@keyframes e404-map { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes e404-swing { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes e404-fp { 0% { opacity: 0; } 10% { opacity: .85; } 60% { opacity: .85; } 85%, 100% { opacity: 0; } }

/* 500: memperbaiki server */
.e500-owl { transform-origin: 60px 136px; animation: e500-bob 1.4s ease-in-out infinite; }
.e500-arm { transform-origin: 100px 102px; animation: e500-tap 1.4s ease-in-out infinite; }
.e500-sp { transform-box: fill-box; transform-origin: center; opacity: 0; animation: e500-spark 1.4s ease-out infinite; animation-delay: calc(var(--i) * .1s); }
.e500-led { animation: e500-led 1s steps(1) infinite; }
.e500-smoke { transform-box: fill-box; transform-origin: center; opacity: 0; animation: e500-smoke 3.2s ease-out infinite; animation-delay: calc(var(--i) * 1.4s); }
.e500-cable { transform-origin: 252px 142px; animation: e500-sway 2.6s ease-in-out infinite alternate; }
.e500-warn { animation: e500-warn 1.6s ease-in-out infinite; }
@keyframes e500-bob { 0%, 100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg); } }
@keyframes e500-tap { 0%, 100% { transform: rotate(-12deg); } 40% { transform: rotate(5deg); } 50% { transform: rotate(-3deg); } 60% { transform: rotate(6deg); } }
@keyframes e500-spark { 0%, 36% { opacity: 0; transform: scale(.3); } 46% { opacity: 1; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(.4) translate(-8px, -8px); } }
@keyframes e500-led { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .2; } }
@keyframes e500-smoke { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: .55; } 100% { opacity: 0; transform: translateY(-56px) scale(1.8); } }
@keyframes e500-sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
@keyframes e500-warn { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* 503: pemeliharaan */
.e503-g { animation: e503-spin var(--t, 14s) linear infinite; }
.e503-rev { animation-direction: reverse; }
.e503-owl { transform-origin: 60px 136px; animation: e500-bob 2.4s ease-in-out infinite; }
.e503-arm { transform-origin: 100px 102px; animation: e503-hit 1.8s ease-in-out infinite; }
.e503-lamp { animation: e500-led 1.2s steps(1) infinite; }
@keyframes e503-spin { to { transform: rotate(360deg); } }
@keyframes e503-hit { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(-32deg); } 66% { transform: rotate(14deg); } 78% { transform: rotate(8deg); } }

/* 419: sesi habis, tertidur */
.e419-owl { transform-origin: 60px 136px; animation: e419-breath 4.2s ease-in-out infinite; }
.e419-z { transform-box: fill-box; transform-origin: center; opacity: 0; animation: e419-z 3.6s ease-in-out infinite; animation-delay: calc(var(--i) * 1s); }
.e419-st { animation: e419-tw 3s ease-in-out infinite; animation-delay: calc(var(--i) * .6s); }
.e419-glass { transform-origin: 262px 148px; animation: e419-wob 5s ease-in-out infinite; }
.e419-grain { animation: e419-drop 1.4s linear infinite; }
@keyframes e419-breath { 0%, 100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(-4deg) scale(1.025, 1.04); } }
@keyframes e419-z { 0% { opacity: 0; transform: translate(0, 6px) scale(.8); } 25% { opacity: .95; } 100% { opacity: 0; transform: translate(14px, -20px) scale(1.15); } }
@keyframes e419-tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes e419-wob { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes e419-drop { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(24px); } }

/* 403: palang turun, burung hantu menggeleng */
.e403-arm { transform-origin: 326px 151px; animation: e403-drop 1.3s ease-in both; }
.e403-lock { transform-origin: 190px 160px; animation: e403-swing 3s ease-in-out 1.3s infinite alternate; }
.e403-owl { transform-origin: 60px 136px; animation: e403-no 6s ease-in-out 1.8s infinite; }
.e403-no { transform-box: fill-box; transform-origin: center; animation: e403-pulse 2.4s ease-in-out infinite; }
@keyframes e403-drop { 0% { transform: rotate(70deg); } 55% { transform: rotate(0); } 72% { transform: rotate(-3deg); } 86% { transform: rotate(.8deg); } 100% { transform: rotate(0); } }
@keyframes e403-swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
@keyframes e403-no { 0%, 70%, 100% { transform: rotate(0); } 73% { transform: rotate(-5deg); } 77% { transform: rotate(5deg); } 81% { transform: rotate(-4deg); } 85% { transform: rotate(4deg); } 89% { transform: rotate(0); } }
@keyframes e403-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* 429: terengah-engah */
.e429-wing { transform-origin: 14px 86px; animation: e429-fast .2s ease-in-out 14 alternate, e429-slow 1s ease-in-out 2.8s infinite alternate; }
.e429-pant { transform-origin: 60px 136px; animation: e429-pant .55s ease-in-out infinite alternate; }
.e429-mouth { transform-box: fill-box; transform-origin: 50% 0; animation: e429-mouth .55s ease-in-out infinite alternate; }
.e429-sw { transform-box: fill-box; transform-origin: center; opacity: 0; animation: e429-sweat-l 1.8s ease-in infinite; }
.e429-sw-r { animation-name: e429-sweat-r; }
@keyframes e429-fast { from { transform: rotate(-8deg); } to { transform: rotate(40deg); } }
@keyframes e429-slow { from { transform: rotate(-4deg); } to { transform: rotate(16deg); } }
@keyframes e429-pant { from { transform: scale(1); } to { transform: scale(1.03, .985); } }
@keyframes e429-mouth { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
@keyframes e429-sweat-l { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-14px, 36px); } }
@keyframes e429-sweat-r { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, 36px); } }

/* 413: berkas terlalu berat */
.e413-load { transform-origin: 180px 222px; animation: e413-wob 2.2s ease-in-out infinite alternate; }
.e413-owl { transform-origin: 60px 136px; animation: e413-sink 2.2s ease-in-out infinite alternate; }
.e413-leg { animation: e413-shake .14s linear infinite alternate; }
.e413-dust { transform-box: fill-box; transform-origin: center; opacity: 0; animation: e413-dust 2.2s ease-out infinite; animation-delay: calc(var(--i) * 1.1s); }
.e413-sw { animation: e429-sweat-l 1.6s ease-in infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
@keyframes e413-wob { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes e413-sink { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(3px) rotate(2deg); } }
@keyframes e413-shake { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
@keyframes e413-dust { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: .55; } 100% { opacity: 0; transform: translate(0, -8px) scale(2); } }

/* 4xx lain */
.e4xx-owl { transform-origin: 60px 136px; animation: e4xx-tilt 5s ease-in-out infinite; }
@keyframes e4xx-tilt { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(4deg); } }

@media (max-width: 640px) {
    .er-actions .er-btn { width: 100%; }
    .er-inner { padding-top: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
    .er *, .er *::before, .er *::after { animation: none !important; transition: none !important; }
    .e404-fp, .e500-smoke, .e419-z { opacity: .6; }
    .e500-sp, .e413-dust, .e429-sw { opacity: 0; }
    .er-bar i { width: 45%; }
}
</style></head>
