; Salin ke /etc/supervisor/conf.d/ lalu: supervisorctl reread && supervisorctl update
[program:platform-karier-worker]
command=php /var/www/platform-karier/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/platform-karier
user=www-data
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/log/platform-karier-worker.log

; Cron untuk scheduler (crontab -e sebagai www-data):
; * * * * * cd /var/www/platform-karier && php artisan schedule:run >> /dev/null 2>&1
